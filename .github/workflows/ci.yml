name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"

      - name: Sync dependencies
        run: uv sync --locked --all-groups

      - name: Check repository guardrails
        run: uv run python scripts/check_repo_guardrails.py

      - name: Check repository readiness
        run: uv run python scripts/check_repo_readiness.py

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Run bounded offline demo
        env:
          DATA_DIR: ${{ runner.temp }}/urban-mobility-demo
        run: uv run python scripts/run_demo.py --data-dir "$DATA_DIR"

      - name: Validate Compose configuration
        run: docker compose config

  web-format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Check frontend formatting
        run: npm --prefix apps/web run format:check

  web-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Lint frontend
        run: npm --prefix apps/web run lint

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Typecheck frontend
        run: npm --prefix apps/web run typecheck

  web-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Test frontend
        run: npm --prefix apps/web run test

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Build frontend
        run: npm --prefix apps/web run build

  web-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.21"

      - name: Sync Python dependencies
        run: uv sync --locked --all-groups

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Install Playwright Chromium
        run: npx --prefix apps/web playwright install --with-deps chromium

      - name: Run sample-backed browser tests
        env:
          URBAN_MOBILITY_E2E_DATA_DIR: ${{ runner.temp }}/urban-mobility-web-e2e
        run: npm --prefix apps/web run e2e

      - name: Upload Playwright diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7

  dependency-security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: "apps/web/package-lock.json"

      - name: Install frontend dependencies
        run: npm ci --prefix apps/web

      - name: Audit frontend dependencies
        run: npm audit --prefix apps/web --audit-level=high

      - name: Report dependency review limitation
        if: ${{ github.event_name == 'pull_request' }}
        run: echo "Dependency review is owner-gated because this repository has Dependency Graph disabled."
