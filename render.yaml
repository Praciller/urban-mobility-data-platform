services:
  - type: web
    name: praciller-urban-mobility-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deploy/render/Dockerfile.api
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false

  - type: web
    name: praciller-urban-mobility-dashboard
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: npm ci --prefix apps/web && npm --prefix apps/web run build
    staticPublishPath: ./apps/web/dist
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: praciller-urban-mobility-api
          envVarKey: RENDER_EXTERNAL_URL
